<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&amp;family=Inter:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#FAF7F2"/>

  <!-- Top photo zone: warm sand wash, replace with actual photo in Penpot -->
  <rect width="1080" height="560" fill="#F1E9DA"/>
  <rect width="1080" height="560" fill="#9F4D2D" opacity="0.06"/>

  <!-- Photo placeholder -->
  <rect x="340" y="248" width="400" height="64" rx="6" fill="none" stroke="#C4A882" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="540" y="284" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#A08060" letter-spacing="1">PHOTO — hands at the wheel</text>

  <!-- Left accent bar -->
  <rect x="0" y="560" width="6" height="790" fill="#9F4D2D"/>

  <!-- Headline line 1 -->
  <text x="72" y="688" font-family="'Cormorant Garamond', Georgia, serif" font-size="104" font-weight="300" fill="#2A2520" letter-spacing="-3">Make something</text>

  <!-- Headline line 2 in terracotta -->
  <text x="72" y="800" font-family="'Cormorant Garamond', Georgia, serif" font-size="104" font-weight="300" fill="#9F4D2D" letter-spacing="-3">with your hands.</text>

  <!-- Divider line -->
  <line x1="72" y1="844" x2="220" y2="844" stroke="#E1D6C5" stroke-width="1.5"/>

  <!-- Sub copy -->
  <text x="72" y="904" font-family="Inter, sans-serif" font-size="30" font-weight="400" fill="#6B5F54">Ceramics workshops in English</text>
  <text x="72" y="948" font-family="Inter, sans-serif" font-size="26" font-weight="400" fill="#6B5F54">Valencia · small groups · all levels</text>

  <!-- Detail pills -->
  <rect x="72" y="992" width="168" height="44" rx="22" fill="#F1E9DA" stroke="#E1D6C5" stroke-width="1"/>
  <text x="156" y="1020" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" fill="#2A2520">From €30</text>

  <rect x="256" y="992" width="180" height="44" rx="22" fill="#F1E9DA" stroke="#E1D6C5" stroke-width="1"/>
  <text x="346" y="1020" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" fill="#2A2520">2–3 hours</text>

  <rect x="452" y="992" width="254" height="44" rx="22" fill="#F1E9DA" stroke="#E1D6C5" stroke-width="1"/>
  <text x="579" y="1020" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" fill="#2A2520">clay included</text>

  <!-- CTA button -->
  <rect x="72" y="1084" width="488" height="76" rx="10" fill="#9F4D2D"/>
  <text x="316" y="1132" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="500" fill="#FAF7F2">Message us on WhatsApp →</text>

  <!-- Secondary CTA -->
  <text x="72" y="1196" font-family="Inter, sans-serif" font-size="20" fill="#6B5F54">or visit saged.club to see the schedule</text>

  <!-- Divider line above footer -->
  <line x1="72" y1="1240" x2="1008" y2="1240" stroke="#E1D6C5" stroke-width="1"/>

  <!-- Footer -->
  <circle cx="72" cy="1292" r="5" fill="#6E7F5A"/>
  <text x="92" y="1298" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-weight="300" fill="#2A2520" letter-spacing="1">saged.club</text>
  <text x="1008" y="1298" text-anchor="end" font-family="Inter, sans-serif" font-size="20" fill="#6B5F54">@saged_diana</text>

</svg>
