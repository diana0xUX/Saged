<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<defs>
  <style>
    @font-face { font-family:'Costa'; src:url('../assets/fonts/costa-light.otf') format('opentype'); font-weight:300; }
  </style>
  <clipPath id="photo-clip">
    <rect x="60" y="330" width="480" height="540" rx="24"/>
  </clipPath>
</defs>

<!-- Background -->
<rect width="1080" height="1350" fill="#F9F4ED"/>

<!-- Figures at edges: named with %20 for spaces, placed last so they layer correctly -->

<!-- HEADER -->
<text x="60" y="66" font-family="'Costa', Georgia, serif" font-size="22" fill="#2A2520" letter-spacing="6">SAGED CLUB</text>
<image href="../assets/images/logo-saged-club.svg" x="892" y="28" width="132" height="60"/>

<!-- HEADLINE -->
<text x="60" y="208" font-family="'Costa', Georgia, serif" font-size="172" fill="#2A2520" letter-spacing="-5">CERAMICS</text>
<text x="60" y="378" font-family="'Costa', Georgia, serif" font-size="172" fill="#FF7A23" letter-spacing="-5">IN VALENCIA</text>

<!-- RIGHT COLUMN — all content before photo so photo clips above photo zone -->

<!-- EVERY THURSDAY badge -->
<rect x="576" y="500" width="448" height="84" rx="42" fill="#FF7A23"/>
<text x="800" y="549" text-anchor="middle" font-family="'Costa', Georgia, serif" font-size="30" fill="#F9F4ED" letter-spacing="1">EVERY THURSDAY</text>
<text x="800" y="572" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#F9F4ED" letter-spacing="1" opacity="0.9">OLD CITY · VALENCIA</text>

<!-- Course title -->
<text x="576" y="648" font-family="'Costa', Georgia, serif" font-size="32" fill="#2A2520">2-day pottery course</text>

<!-- Body copy -->
<text x="576" y="698" font-family="Inter, sans-serif" font-size="23" fill="#6B5F54">Throw · glaze · take your piece home</text>
<text x="576" y="730" font-family="Inter, sans-serif" font-size="23" fill="#6B5F54">Small group · all materials included</text>

<!-- Price blob -->
<ellipse cx="790" cy="860" rx="190" ry="98" fill="#FF7A23"/>
<text x="790" y="842" text-anchor="middle" font-family="'Costa', Georgia, serif" font-size="68" fill="#F9F4ED">€60</text>
<text x="790" y="876" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" fill="#F9F4ED">2 sessions · 2h each · up to 6</text>

<!-- PHOTO — correct image, renders on top of headline overlap zone -->
<image href="../assets/images/workshop-teaching.jpg" x="60" y="330" width="480" height="540" clip-path="url(#photo-clip)" preserveAspectRatio="xMidYMid slice"/>

<!-- IN ENGLISH pill — rendered AFTER photo so it sits on top -->
<rect x="60" y="396" width="248" height="44" rx="22" fill="#2A2520"/>
<text x="184" y="424" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#F9F4ED" letter-spacing="2">IN ENGLISH</text>

<!-- Photo label — also after photo -->
<text x="220" y="325" text-anchor="middle" font-family="'Costa', Georgia, serif" font-size="22" fill="#9F4D2D">KORITSIA →</text>

<!-- Brand figures — last so they layer over background, under text -->
<image href="../assets/images/figures/figure%201.png"  x="-15"  y="100"  width="130" height="165" opacity="0.48"/>
<image href="../assets/images/figures/figure%2022.png" x="928"  y="140"  width="120" height="155" opacity="0.46"/>
<image href="../assets/images/figures/figure%2027.png" x="932"  y="900"  width="115" height="148" opacity="0.46"/>
<image href="../assets/images/figures/figure%206.png"  x="24"   y="1060" width="108" height="140" opacity="0.44"/>
<image href="../assets/images/figures/figure%2023.png" x="640"  y="1120" width="100" height="128" opacity="0.40"/>

<!-- Sparkle accent -->
<text x="560" y="800" font-family="Inter, sans-serif" font-size="28" fill="#FF7A23">✦</text>

<!-- DIVIDER -->
<line x1="60" y1="1004" x2="1020" y2="1004" stroke="#E1D6C5" stroke-width="1.5"/>

<!-- BOTTOM: address + WhatsApp CTA -->
<text x="60" y="1046" font-family="Inter, sans-serif" font-size="19" fill="#6B5F54">C/ de la Correu, 8 · Casco Antiguo, Valencia</text>

<rect x="60" y="1064" width="580" height="72" rx="10" fill="#2A2520"/>
<text x="350" y="1109" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#F9F4ED">WhatsApp +34 695 73 19 00  →</text>

<!-- Symbols strip, faint -->
<image href="../assets/images/saged-symbols.svg" x="60" y="1164" width="440" height="68" opacity="0.16"/>

<!-- FOOTER -->
<line x1="60" y1="1274" x2="1020" y2="1274" stroke="#E1D6C5" stroke-width="1"/>
<text x="60" y="1314" font-family="'Costa', Georgia, serif" font-size="28" fill="#2A2520" letter-spacing="1">saged.club</text>
<text x="1020" y="1314" text-anchor="end" font-family="Inter, sans-serif" font-size="20" fill="#6B5F54">@saged_diana</text>

</svg>
