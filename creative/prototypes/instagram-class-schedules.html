<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saged.club class schedules</title>
<style>
@font-face{font-family:Costa;src:url('../../assets/fonts/costa-light.otf') format('opentype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden;font-family:"Courier New",monospace}.post{width:1080px;height:1350px;position:relative;background-size:cover;background-position:center;color:#faf7f2;overflow:hidden}.post:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,21,18,.08) 0%,rgba(25,21,18,.02) 30%,rgba(25,21,18,.72) 59%,rgba(25,21,18,.96) 100%)}
.top{position:absolute;left:48px;top:46px}.brand{font-family:Costa,Georgia,serif;font-size:27px;line-height:.72;color:#ff7a23;text-transform:uppercase}.brand span{display:block}.issue,.kicker,.lang{display:none}
.content{position:absolute;left:54px;right:54px;bottom:40px}.title{font-family:Costa,Georgia,serif;font-size:78px;line-height:.76;letter-spacing:-.04em;font-weight:400;margin:0 0 18px;max-width:760px;text-transform:lowercase}.title:after{content:' /';color:#ff7a23;font-family:Georgia,serif;font-style:italic;font-size:.5em;vertical-align:top}.list{border-top:2px solid #faf7f2;padding-top:3px}.row{display:grid;grid-template-columns:82px 1fr auto;gap:18px;align-items:center;min-height:48px;border-bottom:1px dashed rgba(250,247,242,.23)}.day{font-size:11px;font-weight:700;letter-spacing:.11em;color:#ff7a23}.name{font-family:Georgia,serif;font-style:italic;font-size:19px;letter-spacing:-.01em}.time{font-family:"Courier New",monospace;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;border:1px solid rgba(250,247,242,.48);border-radius:99px;padding:5px 9px}.footer{display:flex;justify-content:flex-end;margin-top:14px}.cta{color:#2a2520;background:#ff7a23;padding:8px 11px;transform:rotate(-1deg);font-weight:700;font-size:11px}.kids .title{font-size:88px}.kids .row{min-height:56px}.kids .name{font-size:21px}
</style></head><body><main class="post"><div class="top"><div class="brand"><span>SAGED</span><span>CLUB</span></div><div class="issue">Weekly rhythm</div></div><section class="content"><div class="kicker"></div><h1 class="title"></h1><div class="list"></div><footer class="footer"><span class="lang"></span><span class="cta">Message to book ↗</span></footer></section></main>
<script>
const adult={cls:'adult',bg:'../library/04-social/instagram-posts/adult-classes-backdrop-2026.png',kicker:'Clay · coffee · people',title:'Adults<br>at Saged',lang:'Vita · ENG / ES &nbsp;·&nbsp; Korytsia · RU / UA',rows:[['TUE','Beginners Ceramics','14:00'],['TUE','Evening Ceramics','18:00'],['WED','Beginners Ceramics','16:00'],['THU','Coffee with Korytsia','12:00'],['THU','ADHD Clay Group','19:00'],['FRI','Evening Ceramics','18:00'],['FRI','Ceramics & Wine','20:00'],['SAT','ADHD Adults Group','18:00'],['SUN','Couples Masterclass','15:00'],['SUN','Clay Workshop','18:15'],['MON','Ceramic Studio Coworking','All day']]};
const kids={cls:'kids',bg:'../library/04-social/instagram-posts/kids-classes-backdrop-2026.png',kicker:'Clay · stories · imagination',title:'Kids +<br>families',lang:'With Korytsia · RU / UA',rows:[['THU','Story Therapy · kids 5+','10:20'],['THU','Kids Ceramics · ages 8–15','16:00'],['SAT','Story Therapy · kids 5+','10:20'],['SAT','Kids + Parents','12:00'],['SAT','Kids Ceramics · ages 8–15','15:00'],['SUN','Story Therapy · kids 5+','10:20']]};
const d=new URLSearchParams(location.search).get('post')==='kids'?kids:adult,p=document.querySelector('.post');p.classList.add(d.cls);p.style.backgroundImage=`url('${d.bg}')`;document.querySelector('.kicker').textContent=d.kicker;document.querySelector('.title').innerHTML=d.title;document.querySelector('.lang').innerHTML=d.lang;document.querySelector('.list').innerHTML=d.rows.map(r=>`<div class="row"><span class="day">${r[0]}</span><span class="name">${r[1]}</span><span class="time">${r[2]}</span></div>`).join('');
</script></body></html>
