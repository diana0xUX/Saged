<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saged.club avatar</title>
<style>
@font-face{font-family:Costa;src:url('../../assets/fonts/costa-light.otf') format('opentype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#2a2520}
.avatar{width:1024px;height:1024px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 38% 28%,#413831 0,#2a2520 48%,#171411 100%);overflow:hidden}
.avatar:before{content:"";position:absolute;inset:42px;border:23px solid #ff7a23;border-radius:50%;box-shadow:0 0 0 7px rgba(250,247,242,.95),inset 0 0 90px rgba(0,0,0,.26)}
.avatar:after{content:"";position:absolute;inset:0;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
.type{position:relative;z-index:1;font-family:Costa,Georgia,serif;font-size:212px;line-height:.72;letter-spacing:-.035em;text-align:center;color:#faf7f2;text-transform:uppercase;transform:translateY(-4px)}
.type span{display:block}.type span:first-child{color:#ff7a23;text-shadow:0 4px 0 #faf7f2}.spark{position:absolute;z-index:2;color:#faf7f2;font-size:72px;right:130px;top:139px;transform:rotate(10deg)}
</style></head><body><main class="avatar"><div class="spark">✦</div><div class="type"><span>Saged</span><span>Club</span></div></main></body></html>
