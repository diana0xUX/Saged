<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saged.club instructor schedules</title>
<style>
@font-face{font-family:Costa;src:url('../../assets/fonts/costa-light.otf') format('opentype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1350px;overflow:hidden}.post{width:1080px;height:1350px;position:relative;background-size:cover;background-position:center;color:#faf7f2;font-family:"Courier New",monospace;overflow:hidden}.post:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,22,18,.02) 0%,rgba(28,22,18,.02) 38%,rgba(28,22,18,.72) 65%,rgba(28,22,18,.96) 100%)}
.logo{position:absolute;left:48px;top:44px;font-family:Costa,Georgia,serif;font-size:29px;line-height:.72;text-transform:uppercase;color:#ff7a23}.logo span{display:block}.language{position:absolute;right:48px;top:48px;background:#ff7a23;color:#2a2520;padding:10px 13px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transform:rotate(2deg);box-shadow:3px 3px 0 #faf7f2}
.content{position:absolute;left:54px;right:54px;bottom:40px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ff7a23;margin-bottom:10px}.title{font-family:Costa,Georgia,serif;font-size:88px;line-height:.76;letter-spacing:-.04em;text-transform:lowercase;margin:0 0 20px;font-weight:400}.title em{font-family:Georgia,serif;font-weight:400;font-size:.44em;letter-spacing:-.02em;color:#ff7a23}.list{border-top:2px solid #faf7f2;padding-top:4px}.row{display:grid;grid-template-columns:82px 1fr auto;align-items:center;gap:18px;min-height:56px;border-bottom:1px dashed rgba(250,247,242,.28)}.day{font-size:11px;letter-spacing:.11em;color:#ff7a23;font-weight:700}.name{font-family:Georgia,serif;font-style:italic;font-size:21px}.time{font-size:14px;font-weight:700;border:1px solid rgba(250,247,242,.5);border-radius:99px;padding:5px 9px;font-variant-numeric:tabular-nums}.footer{display:flex;justify-content:flex-end;margin-top:14px}.cta{background:#ff7a23;color:#2a2520;padding:8px 11px;font-size:11px;font-weight:700;transform:rotate(-1deg)}
.vita{background-position:center}.vita .content{bottom:43px}.vita .title{font-size:106px}.vita .row{min-height:65px}.vita .name{font-size:24px}.korytsia{background-position:center 36%}.korytsia .title{font-size:75px;margin-bottom:16px}.korytsia .row{min-height:47px}.korytsia .name{font-size:18px}
</style></head><body><main class="post"><div class="logo"><span>Saged</span><span>Club</span></div><div class="language"></div><section class="content"><div class="eyebrow">Weekly classes</div><h1 class="title"></h1><div class="list"></div><footer class="footer"><span class="cta">Message to book ↗</span></footer></section></main>
<script>
const vita={cls:'vita',bg:'../library/04-social/instagram-posts/adult-classes-backdrop-2026.png',language:'English + Spanish',title:'Ceramics <em>/</em><br>with Vita',rows:[['TUE','Beginners Ceramics','14:00'],['TUE','Evening Ceramics','18:00'],['WED','Beginners Ceramics','16:00'],['FRI','Evening Ceramics','18:00'],['FRI','Ceramics & Wine','20:00']]};
const korytsia={cls:'korytsia',bg:'../library/03-photos/koritsia/koritsa.jpg',language:'Russian + Ukrainian',title:'Classes <em>/</em><br>with Korytsia',rows:[['THU','Story Therapy · kids 5+','10:20'],['THU','Coffee with Korytsia','12:00'],['THU','Kids Ceramics · ages 8–15','16:00'],['THU','ADHD Clay Group','19:00'],['SAT','Story Therapy · kids 5+','10:20'],['SAT','Kids + Parents','12:00'],['SAT','Kids Ceramics · ages 8–15','15:00'],['SAT','ADHD Adults Group','18:00'],['SUN','Story Therapy · kids 5+','10:20'],['SUN','Couples Masterclass','15:00'],['SUN','Clay Workshop','18:15']]};
const d=new URLSearchParams(location.search).get('teacher')==='korytsia'?korytsia:vita,p=document.querySelector('.post');p.classList.add(d.cls);p.style.backgroundImage=`url('${d.bg}')`;document.querySelector('.language').textContent=d.language;document.querySelector('.title').innerHTML=d.title;document.querySelector('.list').innerHTML=d.rows.map(r=>`<div class="row"><span class="day">${r[0]}</span><span class="name">${r[1]}</span><span class="time">${r[2]}</span></div>`).join('');
</script></body></html>
