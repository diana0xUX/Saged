name: Weekly Meta Ads report

on:
  schedule:
    # Every Monday 07:00 UTC = 09:00 CEST Madrid (summer)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      end_date:
        description: "End-of-week date (YYYY-MM-DD). Defaults to yesterday."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate weekly report
        env:
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            python3 scripts/audit-weekly.py "${{ inputs.end_date }}"
          else
            python3 scripts/audit-weekly.py
          fi

      - name: Commit + push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly/
          if git diff --staged --quiet; then
            echo "No changes to commit (report unchanged)."
            exit 0
          fi
          git commit -m "report(weekly): $(date -u +%Y-W%V)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed; retrying..."; sleep 3
          done
