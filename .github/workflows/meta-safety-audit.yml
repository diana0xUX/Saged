name: Daily Meta targeting safety audit

on:
  schedule:
    # Runs after the daily performance report and catches unsafe Instagram boosts.
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Meta campaign targeting
        env:
          META_API_VERSION: ${{ secrets.META_API_VERSION }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
        run: python3 scripts/audit-meta-account.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/meta-account-audit-*.md
          if git diff --staged --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "report(meta): daily targeting safety audit"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed; retrying..."; sleep 3
          done
